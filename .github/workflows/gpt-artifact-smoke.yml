name: ROPEJUMP GPT artifact smoke

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  smoke:
    if: ${{ github.actor == 'programmer119' && github.event.issue.title == '[gpt-artifact-smoke]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create tiny file
        run: |
          printf 'ROPEJUMP artifact smoke test\n' > smoke.txt
          wc -c smoke.txt

      - name: Upload tiny artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ropejump-gpt-smoke
          path: smoke.txt
          retention-days: 1
          if-no-files-found: error

      - name: Report artifact id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          body="GPT_ARTIFACT_SMOKE result=success run_id=$RUN_ID artifact_id=$ARTIFACT_ID"
          payload="$(python -c 'import json,sys; print(json.dumps({"body":sys.argv[1]}))' "$body")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE/comments" \
            -d "$payload" >/dev/null
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$ISSUE" \
            -d '{"state":"closed"}' >/dev/null
